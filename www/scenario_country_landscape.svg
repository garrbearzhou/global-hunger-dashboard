<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 420" role="img" aria-label="Scenario country map">
  <defs>
    <linearGradient id="sc-ocean-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="50%" stop-color="#0369a1"/>
      <stop offset="100%" stop-color="#075985"/>
    </linearGradient>
    <radialGradient id="sc-ocean-shimmer" cx="70%" cy="15%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sc-hillshade" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fef3c7" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#1c1917" stop-opacity="0.14"/>
    </linearGradient>

    <linearGradient id="sc-desert-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5deb3" stop-opacity="0.55"/>
      <stop offset="45%" stop-color="#d2a56a" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#a67c3d" stop-opacity="0.28"/>
    </linearGradient>

    <pattern id="sc-dune-lines" width="48" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(-12)">
      <path d="M0 14 Q12 8 24 14 T48 14" fill="none" stroke="#b8956a" stroke-width="0.9" opacity="0.35"/>
      <path d="M0 18 Q16 12 32 18 T48 18" fill="none" stroke="#c9a06e" stroke-width="0.6" opacity="0.25"/>
    </pattern>

    <pattern id="sc-forest-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="#14532d" fill-opacity="0.05"/>
      <circle cx="10" cy="12" r="7" fill="#166534" fill-opacity="0.22"/>
      <circle cx="28" cy="18" r="8" fill="#15803d" fill-opacity="0.2"/>
      <circle cx="16" cy="30" r="6" fill="#14532d" fill-opacity="0.22"/>
    </pattern>

    <linearGradient id="sc-lake-deep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e"/>
      <stop offset="55%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="sc-mtn-shadow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#374151" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#6b7280" stop-opacity="0.35"/>
    </linearGradient>

    <filter id="sc-water-soft" x="-6%" y="-6%" width="112%" height="112%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="0.3"/>
    </filter>

    <symbol id="sc-pine" viewBox="0 0 20 28">
      <path d="M10 1 L18 12 H13 L17 19 H12 L16 27 H4 L8 19 H3 L7 12 H2 Z" fill="#14532d"/>
      <rect x="8.5" y="24" width="3" height="4" rx="0.5" fill="#422006"/>
    </symbol>
    <symbol id="sc-deciduous" viewBox="0 0 22 26">
      <ellipse cx="11" cy="10" rx="9" ry="11" fill="#166534"/>
      <ellipse cx="8" cy="8" rx="5" ry="6" fill="#15803d" opacity="0.7"/>
      <rect x="9.5" y="18" width="3" height="7" rx="1" fill="#57534e"/>
    </symbol>

    <!-- Single cohesive country: mainland + eastern peninsula joined by isthmus -->
    <clipPath id="sc-land-clip">
      <path d="M 54 358
        C 38 328 32 292 40 255
        C 46 218 58 185 52 155
        C 48 125 68 95 102 72
        C 142 52 188 44 232 52
        C 268 58 298 72 322 88
        C 348 78 372 82 392 98
        C 412 114 422 138 418 162
        C 412 186 398 204 382 216
        C 388 228 392 242 402 252
        C 418 262 438 258 452 248
        C 468 258 482 272 488 292
        C 492 312 482 332 462 348
        C 442 362 412 366 388 354
        C 372 342 368 322 372 302
        C 376 282 362 268 345 262
        C 328 268 312 282 298 298
        C 268 318 232 332 192 342
        C 148 352 102 358 68 360
        C 58 360 54 358 54 358 Z"/>
    </clipPath>
  </defs>

  <!-- Ocean -->
  <rect width="640" height="420" fill="url(#sc-ocean-deep)"/>
  <rect width="640" height="420" fill="url(#sc-ocean-shimmer)"/>

  <!-- Land base (vulnerability color injected at runtime) -->
  <path class="scenario-country-shape" fill="__FILL__" stroke="#1c1917" stroke-width="2" stroke-linejoin="round"
    d="M 54 358
      C 38 328 32 292 40 255
      C 46 218 58 185 52 155
      C 48 125 68 95 102 72
      C 142 52 188 44 232 52
      C 268 58 298 72 322 88
      C 348 78 372 82 392 98
      C 412 114 422 138 418 162
      C 412 186 398 204 382 216
      C 388 228 392 242 402 252
      C 418 262 438 258 452 248
      C 468 258 482 272 488 292
      C 492 312 482 332 462 348
      C 442 362 412 366 388 354
      C 372 342 368 322 372 302
      C 376 282 362 268 345 262
      C 328 268 312 282 298 298
      C 268 318 232 332 192 342
      C 148 352 102 358 68 360
      C 58 360 54 358 54 358 Z"/>

  <g clip-path="url(#sc-land-clip)">
    <path fill="url(#sc-hillshade)" opacity="0.85"
      d="M 54 358 C 110 300 185 255 268 232 C 340 212 400 218 418 248 C 395 300 320 345 210 358 C 130 365 70 362 54 358 Z"/>

    <!-- Northwest mountain range — layered ridges with snow caps -->
    <g id="sc-mountains-nw" opacity="0.95">
      <path fill="url(#sc-mtn-shadow)" d="M 98 118 L 128 68 L 158 118 Z"/>
      <path fill="url(#sc-mtn-shadow)" d="M 138 112 L 168 58 L 198 112 Z"/>
      <path fill="url(#sc-mtn-shadow)" d="M 178 108 L 212 52 L 248 108 Z"/>
      <path fill="url(#sc-mtn-shadow)" d="M 218 115 L 248 72 L 278 115 Z"/>
      <path fill="none" stroke="#374151" stroke-width="1.2" opacity="0.5"
        d="M 98 118 L 128 68 L 158 118 M 138 112 L 168 58 L 198 112 M 178 108 L 212 52 L 248 108 M 218 115 L 248 72 L 278 115"/>
      <path fill="#f8fafc" opacity="0.85" d="M 128 68 L 136 76 L 128 84 Z"/>
      <path fill="#f8fafc" opacity="0.8" d="M 168 58 L 176 66 L 168 74 Z"/>
      <path fill="#f8fafc" opacity="0.9" d="M 212 52 L 222 62 L 212 72 Z"/>
      <path fill="#f8fafc" opacity="0.75" d="M 248 72 L 254 78 L 248 84 Z"/>
    </g>

    <!-- Peninsula highlands (east) -->
    <g id="sc-mountains-east" opacity="0.88">
      <path fill="url(#sc-mtn-shadow)" d="M 418 248 L 442 228 L 468 252 Z"/>
      <path fill="url(#sc-mtn-shadow)" d="M 438 258 L 462 238 L 482 262 Z"/>
      <path fill="#f8fafc" opacity="0.7" d="M 442 228 L 448 234 L 442 240 Z"/>
    </g>

    <!-- Southwest desert — irregular basin, not a circle -->
    <path fill="url(#sc-desert-base)"
      d="M 62 268
        C 82 248 118 242 152 255
        C 182 266 195 292 182 318
        C 165 342 125 348 92 335
        C 68 322 55 295 62 268 Z"/>
    <path fill="url(#sc-dune-lines)"
      d="M 62 268
        C 82 248 118 242 152 255
        C 182 266 195 292 182 318
        C 165 342 125 348 92 335
        C 68 322 55 295 62 268 Z"/>

    <!-- Forest belts -->
    <path fill="url(#sc-forest-pattern)"
      d="M 228 128 C 258 112 298 118 318 142 C 335 162 322 188 288 198 C 255 206 225 182 228 128 Z"/>
    <path fill="url(#sc-forest-pattern)"
      d="M 288 218 C 312 202 342 208 358 232 C 368 252 348 272 318 278 C 292 282 275 258 288 218 Z"/>
    <use href="#sc-pine" x="248" y="138" width="13" height="18" opacity="0.88"/>
    <use href="#sc-pine" x="272" y="152" width="12" height="17" opacity="0.85"/>
    <use href="#sc-deciduous" x="302" y="168" width="15" height="19" opacity="0.86"/>
    <use href="#sc-pine" x="328" y="238" width="13" height="18" opacity="0.84"/>

    <!-- Lakes -->
    <g filter="url(#sc-water-soft)">
      <!-- Alpine lake — fed by mountain streams -->
      <ellipse cx="192" cy="128" rx="22" ry="14" fill="url(#sc-lake-deep)"/>
      <ellipse cx="188" cy="124" rx="10" ry="4" fill="#e0f2fe" opacity="0.4"/>
      <!-- Central lake — main basin -->
      <ellipse cx="278" cy="282" rx="32" ry="20" fill="url(#sc-lake-deep)"/>
      <ellipse cx="272" cy="276" rx="14" ry="6" fill="#bae6fd" opacity="0.42"/>
      <!-- Desert oasis — endorheic, fed by wadi only -->
      <ellipse cx="142" cy="298" rx="16" ry="10" fill="url(#sc-lake-deep)"/>
      <ellipse cx="138" cy="295" rx="7" ry="3" fill="#e0f2fe" opacity="0.35"/>
    </g>

    <!-- Rivers: every segment connects mountain, lake, or coast -->
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- NW peaks → alpine lake -->
      <path d="M 212 72 C 204 88 198 102 194 114" stroke="#0369a1" stroke-width="5.5" opacity="0.32"/>
      <path d="M 212 72 C 204 88 198 102 194 114" stroke="#38bdf8" stroke-width="2.4" opacity="0.82"/>

      <!-- Alpine lake → meander → central lake (outlet at south shore) -->
      <path d="M 192 142
        C 188 158 195 175 208 192
        C 222 210 242 228 258 248
        C 268 262 272 274 278 282"
        stroke="#0369a1" stroke-width="8" opacity="0.32"/>
      <path d="M 192 142
        C 188 158 195 175 208 192
        C 222 210 242 228 258 248
        C 268 262 272 274 278 282"
        stroke="#0ea5e9" stroke-width="4.2" opacity="0.78"/>
      <path d="M 192 142
        C 188 158 195 175 208 192
        C 222 210 242 228 258 248
        C 268 262 272 274 278 282"
        stroke="#e0f2fe" stroke-width="1.2" opacity="0.8"/>

      <!-- Forest tributary (foothill spring) → joins main stem above central lake -->
      <path d="M 248 198
        C 255 212 262 228 268 245
        C 272 258 275 268 278 276"
        stroke="#0369a1" stroke-width="6" opacity="0.3"/>
      <path d="M 248 198
        C 255 212 262 228 268 245
        C 272 258 275 268 278 276"
        stroke="#38bdf8" stroke-width="2.8" opacity="0.74"/>

      <!-- Central lake → south coast delta (outlet meets ocean) -->
      <path d="M 285 298
        C 272 312 252 328 222 342
        C 195 352 168 358 142 360"
        stroke="#0369a1" stroke-width="7.5" opacity="0.32"/>
      <path d="M 285 298
        C 272 312 252 328 222 342
        C 195 352 168 358 142 360"
        stroke="#0ea5e9" stroke-width="4" opacity="0.76"/>

      <!-- Mountain foothill wadi → desert oasis (dry wash, ends at lake) -->
      <path d="M 118 185
        C 125 205 132 225 136 245
        C 138 262 140 278 142 288"
        stroke="#0284c7" stroke-width="4.5" opacity="0.5"/>
      <path d="M 118 185
        C 125 205 132 225 136 245
        C 138 262 140 278 142 288"
        stroke="#7dd3fc" stroke-width="2" opacity="0.68"/>

      <!-- Peninsula highlands → east coast estuary -->
      <path d="M 448 248
        C 458 262 468 278 475 292
        C 480 302 482 312 478 322"
        stroke="#0369a1" stroke-width="6" opacity="0.3"/>
      <path d="M 448 248
        C 458 262 468 278 475 292
        C 480 302 482 312 478 322"
        stroke="#0ea5e9" stroke-width="3.2" opacity="0.74"/>
    </g>

    <!-- Estuary / river mouth at south coast -->
    <path fill="#0ea5e9" opacity="0.45"
      d="M 128 358 C 138 354 148 356 158 358 C 148 362 136 362 128 358 Z"/>
    <path fill="#0ea5e9" opacity="0.4"
      d="M 472 322 C 478 318 484 322 478 328 C 474 326 472 324 472 322 Z"/>
  </g>

  <!-- Coastline -->
  <path fill="none" stroke="#fef9c3" stroke-width="2.2" opacity="0.38" stroke-linejoin="round"
    d="M 54 358 C 38 328 32 292 40 255 C 46 218 58 185 52 155 C 48 125 68 95 102 72 C 142 52 188 44 232 52 C 268 58 298 72 322 88 C 348 78 372 82 392 98 C 412 114 422 138 418 162 C 412 186 398 204 382 216 C 388 228 392 242 402 252 C 418 262 438 258 452 248 C 468 258 482 272 488 292 C 492 312 482 332 462 348 C 442 362 412 366 388 354 C 372 342 368 322 372 302 C 376 282 362 268 345 262 C 328 268 312 282 298 298 C 268 318 232 332 192 342 C 148 352 102 358 68 360 C 58 360 54 358 54 358 Z"/>
  <path fill="none" stroke="#1c1917" stroke-width="2" stroke-linejoin="round" opacity="0.9"
    d="M 54 358 C 38 328 32 292 40 255 C 46 218 58 185 52 155 C 48 125 68 95 102 72 C 142 52 188 44 232 52 C 268 58 298 72 322 88 C 348 78 372 82 392 98 C 412 114 422 138 418 162 C 412 186 398 204 382 216 C 388 228 392 242 402 252 C 418 262 438 258 452 248 C 468 258 482 272 488 292 C 492 312 482 332 462 348 C 442 362 412 366 388 354 C 372 342 368 322 372 302 C 376 282 362 268 345 262 C 328 268 312 282 298 298 C 268 318 232 332 192 342 C 148 352 102 358 68 360 C 58 360 54 358 54 358 Z"/>
</svg>
