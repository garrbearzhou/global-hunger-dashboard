# Validates raw data and regenerates discrepancy/regression reports (no external fetch by default).
# Schedule: quarterly. Add secrets and FETCH_WB=1 only if you want CI to pull WDI over the network.

name: Data pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 1 */3 *" # 06:00 UTC on 1st day of Jan/Apr/Jul/Oct

jobs:
  validate-and-reports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.4"

      - name: Install R packages (minimal)
        run: |
          Rscript -e 'install.packages(c("readr","dplyr","tidyr","stringr"), repos="https://cloud.r-project.org")'

      - name: Validate raw snapshot
        working-directory: ${{ github.workspace }}
        run: Rscript scripts/validate_raw_snapshot.R

      - name: Data discrepancy profile
        run: Rscript scripts/analyze_data_discrepancies.R

      # Full regression script sources app.R (heavy). Uncomment if runner has time + all data files committed.
      # - name: Undernourishment regressions
      #   run: Rscript scripts/vulnerability_undernourishment_regressions.R

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metadata-logs
          path: |
            data/metadata/last_validation_summary.csv
            docs/data_discrepancy_profile.csv
